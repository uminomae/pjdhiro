<svg viewBox="0 0 1000 724" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="1000" height="724" fill="#232733"/>
<text x="40" y="42" fill="#e6e6e6" font-size="26" font-weight="800">60km/hから加速するときの、本当の力</text>
<text x="40" y="70" fill="#9aa0aa" font-size="16">巡航の6速ではなく、実際に加速に使う<tspan fill="#e6e6e6" font-weight="700">3速</tspan>と<tspan fill="#9aa0aa">4速</tspan>で計算。駆動力＝トルク×総減速比÷タイヤ半径。</text>
<text x="40" y="94" fill="#9aa0aa" font-size="16">それを（車重＋体重60kg）で割った値。<tspan fill="#7fe39a" font-weight="700">●＝実測トルク</tspan>／<tspan fill="#9aa0aa">無印＝推定トルク</tspan>。</text>
<text x="40" y="118" fill="#e0a83a" font-size="15">差は小さい。上位4台は4.4〜3.8の範囲に収まる。</text>
