<rect x="40" y="676" width="920" height="52" rx="6" fill="#1b1f27" stroke="#3a4050"/>
<text x="54" y="697" fill="#cfd3da" font-size="15">実測トルクがあるのはNinja400とYZF-R3のみ。他はこの2台の曲線の形を、各車の公式最大トルクに合わせて当てはめた推定。</text>
<text x="54" y="718" fill="#ff9a6a" font-size="14">※直4（CB400SF・ZX-4R）は並列2気筒の形を当てているため甘めに出る。細かい順位の差は断定できない。</text>
