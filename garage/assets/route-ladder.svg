<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <rect x="0" y="0" width="860" height="470" fill="#232733"/>
  <text x="60" y="30" fill="#e6e6e6" font-size="17" font-weight="700">ZX-4Rへ至るルート ── 125から始めて、使い切って、乗り換える</text>
  <text x="60" y="48" fill="#9aa0aa" font-size="11">各段を100%使い切ってから上がる。バーの高さ＝車体の性能。上へ行くほど"公道で使えない余剰"が増える。</text>

  <!-- ground -->
  <line x1="60" y1="390" x2="812" y2="390" stroke="#3a4048" stroke-width="1.5"/>
  <!-- street-usable ceiling -->
  <line x1="60" y1="300" x2="812" y2="300" stroke="#7fe39a" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.8"/>
  <text x="64" y="294" fill="#7fe39a" font-size="10.5" font-weight="600">▲ここまで＝公道（≦60km/h）で使い切れる上限　／　これより上＝サーキット領域</text>

  <!-- rising path -->
  <polyline fill="none" stroke="#5b6470" stroke-width="1.5" stroke-dasharray="4 4" points="130,330 254,300 378,255 502,205 626,150 750,100"/>

  <!-- col0 125 (teal) top=330 -->
  <rect x="78" y="330" width="104" height="60" rx="3" fill="#35c4c4" opacity="0.85"/>
  <text x="130" y="316" fill="#35c4c4" font-size="13" font-weight="700" text-anchor="middle">段0 入口</text>
  <text x="130" y="303" fill="#cfd3da" font-size="10.5" text-anchor="middle">GSX-R125</text>
  <text x="130" y="358" fill="#04140f" font-size="10.5" font-weight="700" text-anchor="middle">合法で全開</text>
  <text x="130" y="374" fill="#04140f" font-size="9" text-anchor="middle">最安・公道</text>

  <!-- col1 250 low-rev (green) top=300 -->
  <rect x="202" y="300" width="104" height="90" rx="3" fill="#47d16c" opacity="0.85"/>
  <text x="254" y="286" fill="#47d16c" font-size="13" font-weight="700" text-anchor="middle">段1 相棒</text>
  <text x="254" y="273" fill="#cfd3da" font-size="10" text-anchor="middle">CBR250R / GSX250R</text>
  <text x="254" y="343" fill="#0c1410" font-size="10.5" font-weight="700" text-anchor="middle">丁寧さ＋直進安定</text>
  <text x="254" y="360" fill="#0c1410" font-size="9.5" text-anchor="middle">低回転を使い切る</text>
  <text x="254" y="376" fill="#0c1410" font-size="9" text-anchor="middle">公道</text>

  <!-- col2 Ninja400 (blue) top=255 -->
  <rect x="326" y="300" width="104" height="90" rx="3" fill="#4aa3ff" opacity="0.85"/>
  <rect x="326" y="255" width="104" height="45" rx="3" fill="#4aa3ff" opacity="0.26" stroke="#4aa3ff" stroke-dasharray="3 3" stroke-width="0.8"/>
  <text x="378" y="241" fill="#4aa3ff" font-size="13" font-weight="700" text-anchor="middle">段2 次</text>
  <text x="378" y="228" fill="#cfd3da" font-size="10.5" text-anchor="middle">Ninja400</text>
  <text x="378" y="345" fill="#08131f" font-size="10.5" font-weight="700" text-anchor="middle">速い器を使い切る</text>
  <text x="378" y="362" fill="#08131f" font-size="9" text-anchor="middle">公道＋走行会</text>

  <!-- col3 ZX-25R (orange) top=205 -->
  <rect x="450" y="300" width="104" height="90" rx="3" fill="#ffb347" opacity="0.85"/>
  <rect x="450" y="205" width="104" height="95" rx="3" fill="#ffb347" opacity="0.24" stroke="#ffb347" stroke-dasharray="3 3" stroke-width="0.8"/>
  <text x="502" y="191" fill="#ffb347" font-size="13" font-weight="700" text-anchor="middle">段3 任意</text>
  <text x="502" y="178" fill="#cfd3da" font-size="10.5" text-anchor="middle">ZX-25R（直4）</text>
  <text x="502" y="252" fill="#cfd3da" font-size="9.5" text-anchor="middle" opacity="0.9">サーキット領域</text>
  <text x="502" y="345" fill="#1a1206" font-size="10.5" font-weight="700" text-anchor="middle">高回転の作法</text>
  <text x="502" y="361" fill="#1a1206" font-size="9" text-anchor="middle">タップ撃ち</text>

  <!-- col4 ZX-4R (red) top=150 -->
  <rect x="574" y="300" width="104" height="90" rx="3" fill="#ff5a5a" opacity="0.85"/>
  <rect x="574" y="150" width="104" height="150" rx="3" fill="#ff5a5a" opacity="0.22" stroke="#ff5a5a" stroke-dasharray="3 3" stroke-width="0.8"/>
  <text x="626" y="136" fill="#ff5a5a" font-size="13" font-weight="700" text-anchor="middle">段4 到達 ★</text>
  <text x="626" y="123" fill="#e6e6e6" font-size="10.5" font-weight="600" text-anchor="middle">ZX-4R</text>
  <text x="626" y="222" fill="#cfd3da" font-size="9.5" text-anchor="middle" opacity="0.9">サーキットで解放</text>
  <text x="626" y="345" fill="#210808" font-size="10.5" font-weight="700" text-anchor="middle">大きな器で</text>
  <text x="626" y="361" fill="#210808" font-size="9" text-anchor="middle">公道は枠に</text>

  <!-- col5 liter (purple) top=100 -->
  <rect x="698" y="300" width="104" height="90" rx="3" fill="#b06bd6" opacity="0.85"/>
  <rect x="698" y="100" width="104" height="200" rx="3" fill="#b06bd6" opacity="0.20" stroke="#b06bd6" stroke-dasharray="3 3" stroke-width="0.8"/>
  <text x="750" y="86" fill="#b06bd6" font-size="13" font-weight="700" text-anchor="middle">段∞ その先</text>
  <text x="750" y="73" fill="#cfd3da" font-size="10.5" text-anchor="middle">リッター</text>
  <text x="750" y="200" fill="#cfd3da" font-size="9.5" text-anchor="middle" opacity="0.85">ほぼサーキット</text>
  <text x="750" y="345" fill="#160820" font-size="10.5" font-weight="700" text-anchor="middle">同じ原理</text>
  <text x="750" y="361" fill="#160820" font-size="9" text-anchor="middle">使い切って上へ</text>

  <!-- footnote -->
  <text x="60" y="430" fill="#7fe39a" font-size="11">「誰も追いつけない」の正体＝速さの数字ではなく、各段で積んだ操作の丁寧さと安全マージン。器を替えても消えない。</text>
  <text x="60" y="450" fill="#9aa0aa" font-size="10">125は"相棒"ではなく"最初の一段"。最も遅く・最も安く・公道で最も合法に全開にできる器で、使い切る作法を覚える。</text>
</svg>
