<circle cx="746.5" cy="473.3" r="8" fill="#5fcf5f" stroke="#232733" stroke-width="2"/>
<text x="746.5" y="497.3" fill="#5fcf5f" font-size="17" font-weight="700" text-anchor="middle">ZX-25R</text>
<circle cx="613.5" cy="236.7" r="8" fill="#e8685f" stroke="#232733" stroke-width="2"/>
<text x="613.5" y="220.7" fill="#e8685f" font-size="17" font-weight="700" text-anchor="middle">ZX-4RR（米国仕様）</text>
<circle cx="253.4" cy="163.3" r="8" fill="#f0883a" stroke="#232733" stroke-width="2"/>
<text x="253.4" y="187.3" fill="#f0883a" font-size="17" font-weight="700" text-anchor="middle">エリミネーターSE（451cc）</text>
<circle cx="195.5" cy="268.3" r="8" fill="#aeb4c0" stroke="#232733" stroke-width="2"/>
<text x="195.5" y="292.3" fill="#aeb4c0" font-size="17" font-weight="700" text-anchor="middle">KTM RC390（参考）</text>
<rect x="40" y="592" width="900" height="52" rx="6" fill="#1b1f27" stroke="#3a4050"/>
<text x="54" y="613" fill="#cfd3da" font-size="15">Ninja400とZ400はカタログ37N·mに対し実測33.9／34.1N·m＝<tspan fill="#7fe39a" font-weight="700">後輪までの損失は約8%</tspan>。実測カーブは各誌とも「フラット」と記述。</text>
<text x="54" y="634" fill="#9aa0aa" font-size="14">※国内仕様の実測が存在するのはNinja400とZX-25Rのみ。ZX-4Rは米国仕様(56hp)、エリミは451ccの値しか無く、国内仕様の証拠にはならない。</text>
</svg>