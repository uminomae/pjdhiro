<svg viewBox="0 0 980 650" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="980" height="650" fill="#232733"/>
<text x="40" y="42" fill="#e6e6e6" font-size="26" font-weight="800">実測で分かっているのは、この点だけ</text>
<text x="40" y="70" fill="#9aa0aa" font-size="16">シャシダイ実測（Dynojet 250i）のピーク値。<tspan fill="#e6e6e6" font-weight="700">●＝後輪の実測</tspan>／<tspan fill="#e6e6e6" font-weight="700">○＝カタログ（クランク）</tspan>。曲線は引けない。</text>
<text x="40" y="94" fill="#9aa0aa" font-size="15"><tspan fill="#e8685f" font-weight="700">赤・橙・灰＝仕様が違う参考値</tspan>（米国仕様／451cc／他社）。国内仕様の値ではない。</text>
