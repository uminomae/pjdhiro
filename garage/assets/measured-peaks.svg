<text x="100" y="241.7" fill="#9aa0aa" font-size="15" text-anchor="end">35</text>
<line x1="110" y1="153.3" x2="870" y2="153.3" stroke="#2c313d" stroke-width="1"/>
<text x="100" y="158.3" fill="#9aa0aa" font-size="15" text-anchor="end">40</text>
<line x1="110.0" y1="120" x2="110.0" y2="520" stroke="#2c313d" stroke-width="1"/>
<text x="110.0" y="546" fill="#cdd2dd" font-size="15" text-anchor="middle">6,000</text>
<line x1="300.0" y1="120" x2="300.0" y2="520" stroke="#2c313d" stroke-width="1"/>
<text x="300.0" y="546" fill="#cdd2dd" font-size="15" text-anchor="middle">8,000</text>
<line x1="490.0" y1="120" x2="490.0" y2="520" stroke="#2c313d" stroke-width="1"/>
<text x="490.0" y="546" fill="#cdd2dd" font-size="15" text-anchor="middle">10,000</text>
<line x1="680.0" y1="120" x2="680.0" y2="520" stroke="#2c313d" stroke-width="1"/>
<text x="680.0" y="546" fill="#cdd2dd" font-size="15" text-anchor="middle">12,000</text>
<line x1="870.0" y1="120" x2="870.0" y2="520" stroke="#2c313d" stroke-width="1"/>
<text x="870.0" y="546" fill="#cdd2dd" font-size="15" text-anchor="middle">14,000</text>
<text x="490.0" y="572" fill="#9aa0aa" font-size="16" text-anchor="middle">最大トルクが出る回転数（rpm）</text>
<text x="34" y="320" fill="#cdd2dd" font-size="16" font-weight="600" text-anchor="middle" transform="rotate(-90 34 320)">最大トルク（N·m）</text>
<text x="116" y="506" fill="#f0883a" font-size="15" font-weight="700">← 一般道の60km/hは3,200〜5,600rpm。この図の左端より外側で、実測点は1つも無い</text>
<line x1="300.0" y1="203.3" x2="300.0" y2="255.0" stroke="#5fcf5f" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.7"/>
