<svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="1000" height="860" fill="#232733"/>
<text x="24" y="34" fill="#e6e6e6" font-size="19" font-weight="700">近場でできる低速練習プラン ── 50m×25m の舗装パッド</text>
<text x="24" y="56" fill="#9aa0aa" font-size="12.5"><tspan fill="#ffb27a" font-weight="700">●</tspan> ペットボトル（水を少量＝重り・柔らかい目印）／外周 <tspan fill="#8ab4e6" font-weight="700">5m</tspan> は転倒時の緩衝帯として空ける／<tspan fill="#7fe39a">破線＝走行ライン</tspan>／速度は低速限定・明るく乾いた路面で</text>
<text x="24" y="56" fill="#cdd2dd" font-size="14.5" font-weight="700">① 8の字（リーンアウト）＋定常円（リーンイン）</text>
<rect x="24" y="86" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="62.0" y="124.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="80.0" y="99" fill="#6f7686" font-size="10" text-anchor="middle">緩衝帯5m</text>
<text x="214.0" y="291" fill="#9aa0aa" font-size="10.5" text-anchor="middle">← 50m →</text>
<text x="13" y="181.0" fill="#9aa0aa" font-size="10.5" text-anchor="middle" transform="rotate(-90 13 181.0)">25m</text>
<text x="24" y="310" fill="#8ab4e6" font-size="11">まず上体を起こし正確に→1本だけ一定速度で回れば定常円＝ハングオフ練習</text>
<circle cx="145.6" cy="181.0" r="49.4" fill="none" stroke="#7fe39a" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="282.4" cy="181.0" r="49.4" fill="none" stroke="#7fe39a" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="144.3" y="173.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="145.6" cy="181.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="281.1" y="173.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="282.4" cy="181.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<text x="145.6" y="184.0" fill="#7fe39a" font-size="10.5" text-anchor="middle">定常円</text>
<text x="514" y="56" fill="#cdd2dd" font-size="14.5" font-weight="700">② スラローム（左右の体重移動を刷り込む）</text>
<rect x="514" y="86" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="552.0" y="124.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="570.0" y="99" fill="#6f7686" font-size="10" text-anchor="middle">緩衝帯5m</text>
<text x="704.0" y="291" fill="#9aa0aa" font-size="10.5" text-anchor="middle">← 50m →</text>
<text x="503" y="181.0" fill="#9aa0aa" font-size="10.5" text-anchor="middle" transform="rotate(-90 503 181.0)">25m</text>
<text x="514" y="310" fill="#8ab4e6" font-size="11">コーンの左右を交互に。左右同数・体を振るリズムを体に入れる</text>
<rect x="588.7" y="173.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="590.0" cy="181.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="649.5" y="173.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="650.8" cy="181.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="710.3" y="173.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="711.6" cy="181.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="771.1" y="173.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="772.4" cy="181.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="831.9" y="173.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="833.2" cy="181.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<polyline fill="none" stroke="#7fe39a" stroke-width="1.8" stroke-dasharray="6 4" points="559.6,181.0 590.0,150.6 620.4,181.0 650.8,211.4 681.2,181.0 711.6,150.6 742.0,181.0 772.4,211.4 802.8,181.0 833.2,150.6 863.6,181.0"/>
<text x="24" y="440" fill="#cdd2dd" font-size="14.5" font-weight="700">③ フルロックUターン（リーンアウト・左右）</text>
<rect x="24" y="470" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="62.0" y="508.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="80.0" y="483" fill="#6f7686" font-size="10" text-anchor="middle">緩衝帯5m</text>
<text x="214.0" y="675" fill="#9aa0aa" font-size="10.5" text-anchor="middle">← 50m →</text>
<text x="13" y="565.0" fill="#9aa0aa" font-size="10.5" text-anchor="middle" transform="rotate(-90 13 565.0)">25m</text>
<text x="24" y="694" fill="#8ab4e6" font-size="11">切れ角一杯・首を出口へ・リアブレーキ引きずり。左右とも</text>
<rect x="136.7" y="557.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="138.0" cy="565.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="288.7" y="557.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="290.0" cy="565.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<path d="M 138.0 538.4 L 290.0 538.4 A 26.6 26.6 0 0 1 290.0 591.6 L 138.0 591.6 A 26.6 26.6 0 0 1 138.0 538.4 Z" fill="none" stroke="#7fe39a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="514" y="440" fill="#cdd2dd" font-size="14.5" font-weight="700">④ 発進→フルブレーキ（丁寧さ）</text>
<rect x="514" y="470" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="552.0" y="508.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="570.0" y="483" fill="#6f7686" font-size="10" text-anchor="middle">緩衝帯5m</text>
<text x="704.0" y="675" fill="#9aa0aa" font-size="10.5" text-anchor="middle">← 50m →</text>
<text x="503" y="565.0" fill="#9aa0aa" font-size="10.5" text-anchor="middle" transform="rotate(-90 503 565.0)">25m</text>
<text x="514" y="694" fill="#8ab4e6" font-size="11">じわっと開け→目印でフルブレーキ停止。開け戻しの丁寧さ</text>
<line x1="582.4" y1="530.8" x2="582.4" y2="599.2" stroke="#6f7686" stroke-width="2"/>
<text x="582.4" y="523.2" fill="#9aa0aa" font-size="10.5" text-anchor="middle">発進</text>
<line x1="590.0" y1="565.0" x2="802.8" y2="565.0" stroke="#7fe39a" stroke-width="2.4" stroke-dasharray="7 4"/>
<polygon points="812.0,560.0 818.0,565.0 812.0,570.0" fill="#7fe39a"/>
<rect x="831.9" y="557.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="833.2" cy="565.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<text x="833.2" y="523.2" fill="#9aa0aa" font-size="10.5" text-anchor="middle">停止</text>
<rect x="24" y="812" width="952" height="34" rx="5" fill="#1b1f27" stroke="#3a4050"/>
<text x="38" y="833" fill="#cfd3da" font-size="12">必要なペットボトル＝<tspan fill="#ffb27a" font-weight="700">5〜6本</tspan>（ドリルは一度に一つ・使い回す）。装備＝ヘルメット/グローブ/プロテクター/ブーツ。1本30〜45分×数本で休憩を挟む。膝の接地は狙わない。</text>
</svg>