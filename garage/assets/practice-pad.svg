<svg viewBox="0 0 1000 806" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect width="1000" height="806" fill="#232733"/>
<text x="24" y="34" fill="#e6e6e6" font-size="19" font-weight="700">ペットボトルだけ、近場でできるお手軽・低速練習プラン</text>
<text x="24" y="58" fill="#9aa0aa" font-size="12.5">目印は<tspan fill="#ffb27a" font-weight="700">ペットボトル5〜6本</tspan>（水を少量＝重り）だけ。場所は <tspan fill="#e6e6e6" font-weight="700">50m×25m の舗装パッド</tspan>（キャンプ場の駐車場ほど）・外周<tspan fill="#8ab4e6" font-weight="700">5m</tspan>は緩衝帯／<tspan fill="#7fe39a">破線＝走行ライン</tspan>／低速限定</text>
<text x="24" y="90" fill="#cdd2dd" font-size="21.8" font-weight="700">① 8の字（リーンアウト）＋定常円（リーンイン）</text>
<rect x="24" y="120" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="62.0" y="158.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="80.0" y="133" fill="#6f7686" font-size="15" text-anchor="middle">緩衝帯5m</text>
<text x="214.0" y="325" fill="#9aa0aa" font-size="15.8" text-anchor="middle">← 50m →</text>
<text x="13" y="215.0" fill="#9aa0aa" font-size="15.8" text-anchor="middle" transform="rotate(-90 13 215.0)">25m</text>
<text x="24" y="344" fill="#8ab4e6" font-size="16.5">まず上体を起こし正確に→1本だけ一定速度で回れば定常円＝ハングオフ練習</text>
<circle cx="145.6" cy="215.0" r="49.4" fill="none" stroke="#7fe39a" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="282.4" cy="215.0" r="49.4" fill="none" stroke="#7fe39a" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="144.3" y="207.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="145.6" cy="215.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="281.1" y="207.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="282.4" cy="215.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<text x="145.6" y="218.0" fill="#7fe39a" font-size="15.8" text-anchor="middle">定常円</text>
<text x="514" y="90" fill="#cdd2dd" font-size="21.8" font-weight="700">② スラローム（左右の体重移動を刷り込む）</text>
<rect x="514" y="120" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="552.0" y="158.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="570.0" y="133" fill="#6f7686" font-size="15" text-anchor="middle">緩衝帯5m</text>
<text x="704.0" y="325" fill="#9aa0aa" font-size="15.8" text-anchor="middle">← 50m →</text>
<text x="503" y="215.0" fill="#9aa0aa" font-size="15.8" text-anchor="middle" transform="rotate(-90 503 215.0)">25m</text>
<text x="514" y="344" fill="#8ab4e6" font-size="16.5">コーンの左右を交互に。左右同数・体を振るリズムを体に入れる</text>
<rect x="588.7" y="207.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="590.0" cy="215.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="649.5" y="207.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="650.8" cy="215.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="710.3" y="207.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="711.6" cy="215.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="771.1" y="207.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="772.4" cy="215.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="831.9" y="207.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="833.2" cy="215.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<polyline fill="none" stroke="#7fe39a" stroke-width="1.8" stroke-dasharray="6 4" points="559.6,215.0 590.0,184.6 620.4,215.0 650.8,245.4 681.2,215.0 711.6,184.6 742.0,215.0 772.4,245.4 802.8,215.0 833.2,184.6 863.6,215.0"/>
<text x="24" y="460" fill="#cdd2dd" font-size="21.8" font-weight="700">③ フルロックUターン（リーンアウト・左右）</text>
<rect x="24" y="490" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="62.0" y="528.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="80.0" y="503" fill="#6f7686" font-size="15" text-anchor="middle">緩衝帯5m</text>
<text x="214.0" y="695" fill="#9aa0aa" font-size="15.8" text-anchor="middle">← 50m →</text>
<text x="13" y="585.0" fill="#9aa0aa" font-size="15.8" text-anchor="middle" transform="rotate(-90 13 585.0)">25m</text>
<text x="24" y="714" fill="#8ab4e6" font-size="16.5">切れ角一杯・首を出口へ・リアブレーキ引きずり。左右とも</text>
<rect x="136.7" y="577.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="138.0" cy="585.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<rect x="288.7" y="577.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="290.0" cy="585.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<path d="M 138.0 558.4 L 290.0 558.4 A 26.6 26.6 0 0 1 290.0 611.6 L 138.0 611.6 A 26.6 26.6 0 0 1 138.0 558.4 Z" fill="none" stroke="#7fe39a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="514" y="460" fill="#cdd2dd" font-size="21.8" font-weight="700">④ 発進→フルブレーキ（丁寧さ）</text>
<rect x="514" y="490" width="380" height="190" rx="4" fill="#1b1f27" stroke="#3a4050"/>
<rect x="552.0" y="528.0" width="304.0" height="114.0" fill="none" stroke="#3a4050" stroke-dasharray="4 4"/>
<text x="570.0" y="503" fill="#6f7686" font-size="15" text-anchor="middle">緩衝帯5m</text>
<text x="704.0" y="695" fill="#9aa0aa" font-size="15.8" text-anchor="middle">← 50m →</text>
<text x="503" y="585.0" fill="#9aa0aa" font-size="15.8" text-anchor="middle" transform="rotate(-90 503 585.0)">25m</text>
<text x="514" y="714" fill="#8ab4e6" font-size="16.5">じわっと開け→目印でフルブレーキ停止。開け戻しの丁寧さ</text>
<line x1="582.4" y1="550.8" x2="582.4" y2="619.2" stroke="#6f7686" stroke-width="2"/>
<text x="582.4" y="543.2" fill="#9aa0aa" font-size="15.8" text-anchor="middle">発進</text>
<line x1="590.0" y1="585.0" x2="802.8" y2="585.0" stroke="#7fe39a" stroke-width="2.4" stroke-dasharray="7 4"/>
<polygon points="812.0,580.0 818.0,585.0 812.0,590.0" fill="#7fe39a"/>
<rect x="831.9" y="577.0" width="2.6" height="4" fill="#ffb27a"/><circle cx="833.2" cy="585.0" r="4.6" fill="#ffb27a" stroke="#232733" stroke-width="0.8"/>
<text x="833.2" y="543.2" fill="#9aa0aa" font-size="15.8" text-anchor="middle">停止</text>
<rect x="24" y="758" width="952" height="34" rx="5" fill="#1b1f27" stroke="#3a4050"/>
<text x="38" y="779" fill="#cfd3da" font-size="12">必要なペットボトル＝<tspan fill="#ffb27a" font-weight="700">5〜6本</tspan>（ドリルは一度に一つ・使い回す）。装備＝ヘルメット/グローブ/プロテクター/ブーツ。1本30〜45分×数本で休憩を挟む。膝の接地は狙わない。</text>
</svg>