<text x="54" y="582" fill="#cfd3da" font-size="12.5">ピークは <tspan fill="#ff8a8a" font-weight="700">ZX-25R 45PS / ZX-4R 77PS</tspan>。だが≤80km/hの押し出す力は <tspan fill="#7fe39a" font-weight="700">エリミネーター(48PS)が全域で最強・ZX-25Rが最弱</tspan>。</text>
<text x="54" y="604" fill="#9aa0aa" font-size="11.5">回さない一般道では“回してナンボ”の高回転4気筒がいちばん遅い＝スペックの順位が逆転する。※トップギア巡航の概算・減速比未反映。</text>
