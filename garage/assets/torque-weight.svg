<text x="40" y="30" fill="#e6e6e6" font-size="18" font-weight="700">≤60km/hの“低速の力” ── トルク ÷ (車重＋体重60kg) でアルファードと比べる</text>
<text x="40" y="50" fill="#9aa0aa" font-size="12">≤60km/hは“<tspan fill="#e6e6e6">トルク(力)</tspan>”が効く。<tspan fill="#e6e6e6" font-weight="600">体重60kgの人が乗った総重量</tspan>で割る（軽い車ほど体重の影響大）。基準＝アルファード。色＝クラス。</text>
