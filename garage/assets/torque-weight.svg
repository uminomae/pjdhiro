<text x="54" y="600" fill="#cfd3da" font-size="12">60kgを乗せると<tspan fill="#e6e6e6" font-weight="700">軽いバイクほど不利</tspan>。この指標でアルファード超えは<tspan fill="#7fe39a" font-weight="700">CBR250RR(回る250)以上・400以上</tspan>。GSX250R/Ninja250は乗車後アルファード以下。</text>
<text x="54" y="622" fill="#ff9a6a" font-size="11.5">※これは素のエンジントルク/総重量。<tspan font-weight="700">バイクは減速比が車の2〜3倍大きい</tspan>ので、同じ数値でも実際の加速はバイクが遥かに上。“順位”より“桁感”で見る。</text>
