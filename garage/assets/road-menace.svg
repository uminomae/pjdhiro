<svg viewBox="0 0 1010 560" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0" y="0" width="1010" height="560" fill="#232733"/>
<text x="40" y="32" fill="#e6e6e6" font-size="18" font-weight="700">高回転型を“使う”と、暴走運転になる ── 一般道での速度の動き（概念図）</text>
<text x="40" y="52" fill="#9aa0aa" font-size="12">高回転を維持して性能を使う＝加速と減速の繰り返し＝<tspan fill="#ff8a8a">前を煽り・後ろに嫌がらせブレーキ</tspan>。つまり<tspan fill="#ff8a8a" font-weight="700">その性能は“暴走族のような走り”でしか発揮できない</tspan>。</text>
<line x1="120" y1="460" x2="920" y2="460" stroke="#5a6070" stroke-width="1.5"/>
<line x1="120" y1="90" x2="120" y2="460" stroke="#5a6070" stroke-width="1.5"/>
<text x="520" y="486" fill="#9aa0aa" font-size="12" text-anchor="middle">時間 →</text>
<text x="34" y="275" fill="#cdd2dd" font-size="13" font-weight="600" text-anchor="middle" transform="rotate(-90 34 275)">速度 km/h</text>
<line x1="120" y1="220" x2="920" y2="220" stroke="#e0a83a" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="126" y="215" fill="#e0a83a" font-size="11">制限速度 60</text>
<polyline fill="none" stroke="#8a90a0" stroke-width="10" opacity="0.25" points="120,240 318,244 515,236 712,240 910,240"/>
<text x="770" y="262" fill="#c0c6d0" font-size="11">周りの車の流れ（一定）</text>
<polyline fill="none" stroke="#ff5a5a" stroke-width="2.6" points="120,284 191,148 223,260 262,292 357,148 389,260 428,292 523,148 554,260 594,292 689,148 720,260 760,292 855,148 894,212"/>
<text x="150" y="140" fill="#ff5a5a" font-size="12" font-weight="700">高回転型を“使う”走り</text>
<polyline fill="none" stroke="#47d16c" stroke-width="3.2" points="120,244 278,236 436,240 594,240 752,236 910,240"/>
<text x="300" y="280" fill="#47d16c" font-size="12" font-weight="700">低回転トルク型（流れに乗ったまま力あり）</text>
<text x="357" y="138" fill="#ff8a8a" font-size="11.5" font-weight="700" text-anchor="middle">↑煽り（前車に迫る）</text>
<text x="594" y="314" fill="#ff8a8a" font-size="11.5" font-weight="700" text-anchor="middle">↓嫌がらせブレーキ（後続がヒヤッ）</text>
<rect x="40" y="500" width="930" height="50" rx="6" fill="#1b1f27" stroke="#3a4050"/>
<text x="54" y="520" fill="#cfd3da" font-size="12">高回転型で<tspan fill="#e6e6e6" font-weight="700">性能を使う＝〈煽り〉加速で前に迫る＋〈嫌がらせブレーキ〉制限で急に緩める＝実質“暴走運転”</tspan>。使わなければ一定速度でOKだが性能はゼロ。</text>
<text x="54" y="540" fill="#7fe39a" font-size="12">法規を守る思いやりの人は、この性能を一生使えない。低回転トルク型だけが一定速度のまま力を出せる＝<tspan font-weight="700">“流れを乱さず高性能”</tspan>。スペック表には載らない差だ。</text>
</svg>